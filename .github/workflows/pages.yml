# Deploys main to GitHub Pages. The deployment is reported to GitHub in the `github-pages`
# environment for the merge commit, which is what Vicunia waits for before "Shipped".
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # A re-run of an older run would otherwise roll the site back to that commit.
      - name: Only deploy the newest commit on main
        run: |
          git fetch --depth=1 origin main
          if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
            echo "::error::$GITHUB_SHA is no longer the head of main. Re-run the newest Deploy run instead."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm test
      - run: mkdir _site && cp -r index.html styles.css favicon.svg src _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
